<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi Hidup Sihat - Navigation</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Quicksand', 'Nunito', 'Segoe UI', sans-serif;
    }

    body {
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 160px;
        padding: 20px;
        overflow: visible;
    }

    .nav-container {
        position: relative;
        display: flex;
        gap: 32px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        padding: 15px 10px;
    }

    /* Butterfly Styles */
    .butterfly {
        position: absolute;
        width: 24px;
        height: 24px;
        pointer-events: none;
        z-index: 10;
        filter: drop-shadow(0 4px 3px rgba(0, 0, 0, 0.12));
        animation: floatGentle 4s ease-in-out infinite;
    }

    .butterfly-1 {
        top: -12px;
        left: 20px;
        animation-delay: 0s;
    }

    .butterfly-2 {
        bottom: -8px;
        left: 42%;
        animation-delay: 1.5s;
    }

    .butterfly-3 {
        top: -5px;
        right: 25px;
        animation-delay: 2.8s;
    }

    .butterfly svg {
        width: 100%;
        height: 100%;
        overflow: visible;
    }

    .wing {
        transform-origin: center;
        animation: flutter 0.3s ease-in-out infinite alternate;
    }

    .wing.right {
        animation-direction: alternate-reverse;
    }

    .nav-container:hover .butterfly {
        transform: translateY(-6px) scale(1.08);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .nav-container:hover .wing {
        animation-duration: 0.15s;
    }

    @keyframes flutter {
        0% { transform: rotateY(0deg) scale(1); }
        100% { transform: rotateY(55deg) scale(0.92); }
    }

    @keyframes floatGentle {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(3deg); }
    }

    /* 3D Button Styles */
    .nav-btn {
        position: relative;
        background-color: #78B982;
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.8px;
        padding: 15px 26px;
        border: 3px solid #FFD84D;
        border-radius: 20px;
        cursor: pointer;
        outline: none;
        user-select: none;
        text-decoration: none;
        box-shadow: 
            inset 0 2px 4px rgba(255, 255, 255, 0.4),
            inset 0 -3px 6px rgba(0, 0, 0, 0.12),
            0 6px 0 #589562,
            0 10px 15px rgba(0, 0, 0, 0.15);
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                    box-shadow 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                    background-color 0.18s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-width: 170px;
        z-index: 2;
    }

    .nav-btn:hover {
        transform: translateY(-4px);
        background-color: #82c48d;
        box-shadow: 
            inset 0 2px 5px rgba(255, 255, 255, 0.5),
            inset 0 -3px 6px rgba(0, 0, 0, 0.1),
            0 10px 0 #589562,
            0 16px 22px rgba(0, 0, 0, 0.2);
    }

    .nav-btn:active {
        transform: translateY(3px) scale(0.98);
        box-shadow: 
            inset 0 2px 3px rgba(0, 0, 0, 0.1),
            0 3px 0 #589562,
            0 4px 6px rgba(0, 0, 0, 0.15);
        transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .btn-icon {
        font-size: 18px;
        font-weight: 900;
    }
</style>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="nav-container">
    <!-- Butterfly 1: Pastel Yellow -->
    <div class="butterfly butterfly-1">
        <svg viewBox="0 0 50 50">
            <path d="M25,20 Q28,25 25,35 Q22,25 25,20" fill="#4A3525"/>
            <path class="wing left" d="M24,22 C15,12 2,15 5,27 C7,35 18,32 24,25 Z" fill="#FFF3A1" opacity="0.95"/>
            <path class="wing right" d="M26,22 C35,12 48,15 45,27 C43,35 32,32 26,25 Z" fill="#FFF3A1" opacity="0.95"/>
            <circle cx="12" cy="20" r="3" fill="#FFD84D" opacity="0.8"/>
            <circle cx="38" cy="20" r="3" fill="#FFD84D" opacity="0.8"/>
        </svg>
    </div>

    <!-- Butterfly 2: Light Pink -->
    <div class="butterfly butterfly-2">
        <svg viewBox="0 0 50 50">
            <path d="M25,20 Q28,25 25,35 Q22,25 25,20" fill="#4A3525"/>
            <path class="wing left" d="M24,22 C15,12 2,15 5,27 C7,35 18,32 24,25 Z" fill="#FFD1DC" opacity="0.95"/>
            <path class="wing right" d="M26,22 C35,12 48,15 45,27 C43,35 32,32 26,25 Z" fill="#FFD1DC" opacity="0.95"/>
            <circle cx="12" cy="20" r="3" fill="#FFA6C1" opacity="0.8"/>
            <circle cx="38" cy="20" r="3" fill="#FFA6C1" opacity="0.8"/>
        </svg>
    </div>

    <!-- Butterfly 3: Subtle Lavender -->
    <div class="butterfly butterfly-3">
        <svg viewBox="0 0 50 50">
            <path d="M25,20 Q28,25 25,35 Q22,25 25,20" fill="#4A3525"/>
            <path class="wing left" d="M24,22 C15,12 2,15 5,27 C7,35 18,32 24,25 Z" fill="#E6E6FA" opacity="0.95"/>
            <path class="wing right" d="M26,22 C35,12 48,15 45,27 C43,35 32,32 26,25 Z" fill="#E6E6FA" opacity="0.95"/>
            <circle cx="12" cy="20" r="3" fill="#D8BFD8" opacity="0.8"/>
            <circle cx="38" cy="20" r="3" fill="#D8BFD8" opacity="0.8"/>
        </svg>
    </div>

    <!-- BACK BUTTON -->
    <a class="nav-btn" href="https://sites.google.com/moe-dl.edu.my/mylloee/jom-pilih-sihat?pli=1&authuser=1" target="_self">
        <span class="btn-icon">←</span> KEMBALI
    </a>

    <!-- NEXT BUTTON -->
    <a class="nav-btn" href="https://sites.google.com/moe-dl.edu.my/mylloee/di-sebalik-misi?authuser=1" target="_self">
        SETERUSNYA <span class="btn-icon">➜</span>
    </a>
</div>

</body>
</html>
